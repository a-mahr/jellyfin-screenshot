version: "3.9"
services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ~/jellyfin/screenshots:/usr/src/app/out
      - ~/jellyfin/media:/media:ro
      - logvolume01:/var/log
    environment:
      - JELLYFIN_URL=http://localhost:8096
      - JELLYFIN_API_KEY=changethis
      - JELLYFIN_USER=changethis
volumes:
  logvolume01: {}
